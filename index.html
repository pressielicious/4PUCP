<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>4P Tracker</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
:root{
  --primary:#5A0000;
  --primary-light:#7A1111;
  --primary-dark:#3A0000;
  --bg:#090909;
  --card:#141414;
  --text:#ffffff;
  --muted:#9a9a9a;
}

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

body{
  font-family:Inter,sans-serif;
  background:
    radial-gradient(circle at top, rgba(120,0,0,0.25), transparent 40%),
    radial-gradient(circle at bottom right, rgba(90,0,0,0.18), transparent 35%),
    linear-gradient(180deg,#090909,#050505);
  background-attachment:fixed;
  color:var(--text);
  padding:16px;
  overflow-x:hidden;
}

.container{
  max-width:900px;
  margin:auto;
}

/* HEADER */
.header{
  background:linear-gradient(135deg,var(--primary),var(--primary-dark));
  padding:20px;
  border-radius:20px;
  margin-bottom:14px;
  box-shadow:0 10px 30px rgba(90,0,0,0.25);

  display:flex;
  align-items:center;
  justify-content:center;
}

.logo{
  width:130px;
  height:auto;
  object-fit:contain;
}

/* GRID */
.grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:10px;
  margin-bottom:12px;
}

.card{
  background:rgba(20,20,20,0.9);
  padding:14px;
  border-radius:16px;
  border:1px solid rgba(255,255,255,0.04);
  backdrop-filter:blur(6px);
}

.label{
  font-size:11px;
  color:var(--muted);
}

.big{
  font-size:24px;
  font-weight:700;
  margin-top:6px;
}

/* SEARCH */
.search input{
  width:100%;
  padding:13px;
  border-radius:14px;
  border:none;
  outline:none;
  background:rgba(20,20,20,0.9);
  color:white;
  margin-bottom:12px;
  font-size:14px;
}

/* PLAYERS */
.players{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(180px,1fr));
  gap:8px;
}

.player{
  background:rgba(20,20,20,0.9);
  padding:10px;
  border-radius:12px;
  border-left:3px solid var(--primary-light);
  transition:0.15s ease;
  min-height:72px;
  display:flex;
  flex-direction:column;
  justify-content:center;
  backdrop-filter:blur(6px);
}

.player:hover{
  transform:translateY(-2px);
}

.priority{
  border-left:3px solid #ff4444;
  box-shadow:0 0 12px rgba(255,0,0,0.18);
}

.name{
  font-weight:600;
  font-size:13px;
  line-height:1.2;
  word-break:break-word;
}

.id{
  margin-top:5px;
  display:inline-block;
  padding:4px 8px;
  background:rgba(90,0,0,0.18);
  border-radius:999px;
  font-size:11px;
  color:#ffb3b3;
  width:fit-content;
}

.uptime{
  margin-top:5px;
  font-size:11px;
  color:#aaa;
}

.empty{
  text-align:center;
  color:var(--muted);
  padding:30px;
  grid-column:1 / -1;
}

.footer{
  text-align:center;
  margin-top:20px;
  color:#888;
  font-size:13px;
}

/* RESPONSIVE */
@media(max-width:900px){
  .players{
    grid-template-columns:repeat(2,1fr);
  }
}

@media(max-width:600px){

  .grid{
    grid-template-columns:1fr;
  }

  .players{
    grid-template-columns:1fr;
  }

  .logo{
    width:110px;
  }

  .big{
    font-size:22px;
  }
}
</style>
</head>

<body>

<div class="container">

  <div class="header">
    <img src="logo.png" class="logo" alt="Logo">
  </div>

  <div class="grid">

    <div class="card">
      <div class="label">Total Online</div>
      <div class="big" id="count">0</div>
    </div>

    <div class="card">
      <div class="label">Date</div>
      <div class="big" id="date">-</div>
    </div>

    <div class="card">
      <div class="label">Last Refresh</div>
      <div class="big" id="time">-</div>
    </div>

  </div>

  <div class="search">
    <input id="search" placeholder="Search player name..." />
  </div>

  <div class="players" id="players">
    <div class="empty">Loading...</div>
  </div>

  <div class="footer">
    Auto refresh every 5 seconds
  </div>

</div>

<script>
const API = "https://servers-frontend.fivem.net/api/servers/single/7y66bb";

let cache = [];

const priorityPlayers = [
  "4P | Jebat",
  "4P | Sood Paragas",
  "4P | Tukiman"
];

const onlineSince = {};

function is4P(name){
  return /4P/i.test(String(name));
}

function getPlayers(data){
  return (
    data?.Data?.players ||
    data?.Data?.Players ||
    data?.Data?.clients ||
    []
  );
}

function formatUptime(ms){

  const total = Math.floor(ms / 1000);

  const h = Math.floor(total / 3600);
  const m = Math.floor((total % 3600) / 60);

  if(h <= 0){
    return `${m}m online`;
  }

  return `${h}h ${m}m online`;
}

function render(players){

  const el = document.getElementById("players");

  if(!players.length){
    el.innerHTML = `<div class='empty'>No 4P players online</div>`;
    return;
  }

  el.innerHTML = players.map(p => {

    const priority = priorityPlayers.includes(p.name);

    return `
      <div class="player ${priority ? 'priority' : ''}">
        <div class="name">${p.name}</div>
        <div class="id">ID: ${p.id ?? 'N/A'}</div>
        <div class="uptime">${p.uptime}</div>
      </div>
    `;
  }).join('');
}

async function load(){

  try{

    const res = await fetch(API, { cache:"no-store" });

    const data = await res.json();

    const playersRaw = getPlayers(data);

    const now = Date.now();

    const filtered = playersRaw

      .map(p => ({
        name: p.name || p,
        id: p.id || "N/A"
      }))

      .filter(p => is4P(p.name))

      .map(p => {

        if(!onlineSince[p.name]){
          onlineSince[p.name] = now;
        }

        return {
          ...p,
          uptime: formatUptime(now - onlineSince[p.name])
        };
      })

      .sort((a,b) => {

        const aPriority = priorityPlayers.includes(a.name);
        const bPriority = priorityPlayers.includes(b.name);

        if(aPriority && !bPriority) return -1;
        if(!aPriority && bPriority) return 1;

        return a.name.localeCompare(b.name);
      });

    cache = filtered;

    document.getElementById("count").innerText = filtered.length;

    document.getElementById("time").innerText =
      new Date().toLocaleTimeString();

    const d = new Date();

    const months = [
      "Jan","Feb","Mar","Apr","May","Jun",
      "Jul","Aug","Sep","Oct","Nov","Dec"
    ];

    document.getElementById("date").innerText =
      d.getDate() + " " + months[d.getMonth()];

    render(filtered);

  }catch(e){

    console.error(e);

    document.getElementById("players").innerHTML =
      `<div class='empty'>Failed to load data</div>`;
  }
}

document.getElementById("search").addEventListener("input", e => {

  const val = e.target.value.toLowerCase();

  render(
    cache.filter(p =>
      p.name.toLowerCase().includes(val)
    )
  );
});

load();

setInterval(load, 5000);
</script>

</body>
</html>
